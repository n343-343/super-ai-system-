name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x android-app/gradlew

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

    - name: Build debug APK with detailed logging
      working-directory: ./android-app
      run: |
        set -e
        # Use plain console + stacktrace/info/debug to ensure Kotlin compiler outputs file/line errors in CI logs
        ./gradlew assembleDebug --stacktrace --info --debug --console=plain --no-daemon

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
